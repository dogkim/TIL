name: Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Node.js 환경 준비 (Vuepress 실행용)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 2. 필요한 도구 설치 및 빌드 (package.json의 scripts 실행)
      - name: Install and Build
        run: |
          npm install
          npm run build  # package.json에 적힌 'vuepress build documents'가 실행됩니다.

      # 3. [최신 방식] 빌드된 결과물(build 폴더)을 배포
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }} 
          publish_dir: build # package.json에서 지정한 결과물 저장 폴더